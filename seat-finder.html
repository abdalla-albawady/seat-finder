<style>
  :root { --bg:#f2f5f9; --card:#fff; --ink:#13233b; --muted:#5b6a80; --line:#d8e0ea;

  * { box-sizing:border-box; }

  input:focus { outline:none; border-color:var(--accent); }
  .hint,.count { color:var(--muted); font-size:.92rem; margin:8px 2px 14px; }
  .student { background:var(--card); border:1px solid var(--line); border-radius:12px;

  .student h2 { font-size:1.1rem; margin:0; }
  .sid { color:var(--muted); font-size:.95rem; margin-bottom:10px; }
  .exam { display:flex; gap:14px; align-items:center; border-top:1px solid var(--line); padding:12px 0 2px; margin-top:10px; }
  .room { background:var(--room); border-radius:10px; min-width:104px; text-align:center; padding:8px 6px; flex:none; }
  .room b { display:block; font-size:1.35rem; letter-spacing:.5px; }
  .room span { font-size:.8rem; color:var(--muted); }
  .info b { display:block; }
  .info span { color:var(--muted); font-size:.93rem; }
  mark { background:var(--hit); color:inherit; border-radius:3px; padding:0 1px; }
  .empty { text-align:center; color:var(--muted); padding:28px 0; }
  .past { opacity:.55; }
  @media (max-width:420px){ .exam{flex-direction:column;align-items:flex-start;} .room{width:100%;} }
</style>

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
var byId = {};
ROWS.forEach(function(r){
  var s = byId[r[1]] || (byId[r[1]] = {name:r[0], id:r[1], key:norm(r[0])+" "+r[1], exams:[]});
  s.exams.push({e:EXAMS[r[2]], room:r[3], no:r[4]});
});
var students = Object.keys(byId).map(function(k){
  var s = byId[k]; s.exams.sort(function(a,b){ return a.e[4]+a.e[3] < b.e[4]+b.e[3] ? -1 : 1; }); return s;
});

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function hl(text,tokens){
  var out = esc(text);
  tokens.forEach(function(t){
    out = out.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  });
  return out;
}
var today = new Date(); 
var todayIso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");

var $q=document.getElementById("q"), $out=document.getElementById("out"), $hint=document.getElementById("hint");
function run(){
  var raw = $q.value.trim();
  if (raw.length < 3){ $out.innerHTML=""; $hint.style.display="block"; return; }
  $hint.style.display="none";
  var tokens = norm(raw).split(/\s+/).filter(Boolean);
  var hits = students.filter(function(s){ return tokens.every(function(t){ return s.key.indexOf(t)!==-1; }); });
  if (!hits.length){ $out.innerHTML='<div class="empty">No student found. Check the spelling, or try only your ID number.</div>'; return; }
  var shown = hits.slice(0,30);
  var html = '<div class="count">'+hits.length+' student'+(hits.length===1?"":"s")+' found'+(hits.length>shown.length?" (showing first 30 – type more to narrow)":"")+'</div>';
  html += shown.map(function(s){
    return '<section class="student"><h2>'+hl(s.name,tokens)+'</h2><div class="sid">ID '+hl(s.id,tokens)+'</div>'+
      s.exams.map(function(x){
        return '<div class="exam'+(x.e[4]<todayIso?' past':'')+'"><div class="room"><b>'+esc(x.room)+'</b><span>No. '+x.no+' on sheet</span></div>'+
          '<div class="info"><b>'+esc(x.e[0])+' – '+esc(x.e[1])+'</b><span>'+esc(x.e[2])+' · '+esc(x.e[3])+'</span></div></div>';
      }).join("")+'</section>';
  }).join("");
  $out.innerHTML = html;
}
$q.addEventListener("input", run);
